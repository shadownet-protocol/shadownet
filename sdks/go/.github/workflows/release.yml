name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # create GitHub Release + upload assets
  packages: write   # push images to ghcr.io
  id-token: write   # OIDC for trusted publishing

jobs:
  binaries:
    name: shadownet CLI binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          check-latest: true

      - name: Cross-compile binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for tuple in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${tuple%/*}"
            goarch="${tuple#*/}"
            outdir="dist/shadownet_${VERSION}_${goos}_${goarch}"
            mkdir -p "$outdir"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
                -o "$outdir/shadownet" ./cmd/shadownet
            cp LICENSE README.md "$outdir/"
            tar -C dist -czf "dist/shadownet_${VERSION}_${goos}_${goarch}.tar.gz" "$(basename "$outdir")"
            rm -rf "$outdir"
          done
          ( cd dist && sha256sum *.tar.gz > SHA256SUMS )
          ls -la dist

      - name: Create GitHub Release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_flag="--generate-notes"
          # Use the existing release if one was created manually beforehand.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            notes_flag=""
          else
            gh release create "${GITHUB_REF_NAME}" $notes_flag --title "${GITHUB_REF_NAME}"
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS --clobber

  images:
    name: ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sca-server
            dockerfile: build/Dockerfile.sca-server
          - name: sns-server
            dockerfile: build/Dockerfile.sns-server
          # The -pg variants live in the pgstore submodule and add Postgres
          # support on top of memory + sqlite. Two images per server give
          # operators a clear choice between lean (sqlite-only) and full
          # (sqlite + postgres) builds without coupling the dep graphs.
          - name: sca-server-pg
            dockerfile: build/Dockerfile.sca-server-pg
          - name: sns-server-pg
            dockerfile: build/Dockerfile.sns-server-pg
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (OIDC)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          # :latest only on the highest semver, never pre-release.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
