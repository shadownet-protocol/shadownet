# Sample sca-server config for the Docker Compose dev stack.
# `did:key` is used here so the dev stack works with no DNS plumbing; for
# production deployments use `did:web:sca.<your-domain>` and serve
# /.well-known/did.json on TLS.
did: "did:web:sca.sh4dow.org"
listen: "0.0.0.0:8443"
signing:
  keyfile: "/etc/shadownet/issuer.jwk"
storage:
  driver: sqlite
  dsn: "/var/lib/shadownet/sca.db"
policy:
  freshnessWindowSeconds: 86400
  statusListBase: "http://127.0.0.1:8443/status/"
  levels:
    - level: "urn:shadownet:level:L1"
      method: "instant-approval"
      credentialLifetimeDays: 90
