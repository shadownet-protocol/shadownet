[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "shadownet-hermes-plugin"
version = "0.4.2"
description = "Shadownet protocol plugin for Hermes Agent."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Shadownet contributors" }]
keywords = ["shadownet", "hermes-agent", "mcp", "a2a", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Typing :: Typed",
]
dependencies = [
    "shadownet>=0.4.1,<0.5",
    "httpx>=0.27",
    "pydantic>=2.7",
]

# In-repo dev override: when working inside the monorepo (CI + local dev),
# resolve `shadownet` from the sibling `python-sdk/` checkout instead of
# PyPI. This lets us iterate on python-sdk and the plugin in lockstep
# before cutting matched releases. External consumers (and the PyPI
# release pipeline that runs `uv sync --no-sources`) ignore this section
# and resolve from PyPI per the version pin above. Mirrors the pattern
# used by `conformance/pyproject.toml`.
[tool.uv.sources]
shadownet = { path = "../../../python-sdk" }

[project.urls]
Homepage = "https://github.com/shadownet-protocol/shadownet/tree/main/integrations/plugins/hermes-agent"
Repository = "https://github.com/shadownet-protocol/shadownet"
Specifications = "https://github.com/shadownet-protocol/shadownet-specs"
Issues = "https://github.com/shadownet-protocol/shadownet/issues"

# Entry point discovered by Hermes Agent's plugin loader. Documented at
# https://hermes-agent.nousresearch.com/docs/user-guide/features/plugins
# under "Distribution & Installation -> Entry Points".
[project.entry-points."hermes_agent.plugins"]
shadownet = "shadownet_hermes_plugin"

[tool.hatch.build.targets.wheel]
packages = ["shadownet_hermes_plugin"]

[tool.hatch.build.targets.wheel.shared-data]
"plugin.yaml" = "share/hermes-plugins/shadownet/plugin.yaml"
"skills" = "share/hermes-plugins/shadownet/skills"

# Local-only dev dep group; not surfaced to runtime users.
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ASYNC", "S", "N", "TC", "TID"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N", "TC"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["shadownet_hermes_plugin"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Hermes Agent ships as `hermes_agent` on PyPI but its plugin-side types live
# in modules that aren't typed for external consumers (per the Hermes docs).
# Plugin code uses these types behind TYPE_CHECKING guards; at runtime they
# resolve when Hermes is installed.
module = ["hermes_agent.*", "gateway.*"]
ignore_missing_imports = true
