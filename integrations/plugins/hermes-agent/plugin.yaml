# Hermes Agent plugin manifest for the Shadownet protocol (v0.2).
#
# Distributed via PyPI (`pip install shadownet-hermes-plugin`) and discovered
# by Hermes through the `hermes_agent.plugins` entry point declared in
# pyproject.toml. The Hermes guide for plugins with third-party Python deps
# explicitly directs distribution via pip — see
# https://hermes-agent.nousresearch.com/docs/user-guide/features/plugins.
# The `hermes plugins install <owner/repo>` path requires plugin.yaml +
# __init__.py at the cloned repo root and does NOT resolve Python deps; our
# plugin pulls in `mcp` and the `shadownet` SDK transitively, so the pip
# entry-point path is the canonical install method.
#
# `requires_env` below is read by Hermes only when a plugin is installed via
# `hermes plugins install` (the Git-clone path). On the pip entry-point path
# Hermes never reads plugin.yaml — env-var validation happens at startup in
# `_adapter.check_shadownet_requirements`. The fields are kept here so the
# manifest is still authoritative if the install path changes.

name: shadownet
version: "0.6.0"
description: >-
  Shadownet v0.2 protocol integration for Hermes Agent. Adds identity-
  anchored agent-to-agent messaging via Shadownet (RFC 0002 MCP control
  surface): MCP tools (identity, resolve, contacts, contact_detail,
  add_contact, send, respond, inbox, inbox_wait), with coordination intents
  (coordinate_v1, propose_plan_v1, confirm_plan_v1, accept_plan_v1) carried
  over send/respond; four skills, a NAT-free inbound channel via the long-poll
  inbox_wait tool, slash commands, lifecycle hooks, and a `hermes shadownet`
  CLI subcommand.

kind: platform

# Declarative — the guide states these are documentation and are not
# enforced against actual register_* calls. Listed for plugin-discovery
# tooling and for users running `hermes plugins list --verbose`.
provides_hooks:
  - on_session_start
  - pre_llm_call
  - on_session_end

provides_commands:
  - shadownet-setup
  - shadownet-inbox
  - shadownet-reach-out
  - shadownet-coordinate
  - shadownet-status
  - shadownet-logout

provides_skills:
  - shadownet:shadownet-setup
  - shadownet:shadownet-reach-out
  - shadownet:shadownet-inbox
  - shadownet:shadownet-coordinate

# MCP tools intentionally NOT under provides_tools — they come from
# `~/.hermes/config.yaml` mcp_servers.shadownet, which is a different
# surface per the Hermes plugin guide.

# Hermes prompts the user for these during `hermes plugins install` and
# verifies they are set at startup. SHADOWNET_CONNECT_URL is the canonical
# one-string bootstrap; SHADOWNET_TOKEN + SHADOWNET_MCP_ENDPOINT is the
# split form for operators wiring it via env directly.
requires_env:
  - name: SHADOWNET_CONNECT_URL
    prompt: shadow://connect URI from your Sidecar's onboarding portal
    help: >-
      The single-string bootstrap form. Carries the MCP endpoint and bearer
      token per RFC 0003 §3. Paste an inline (token=) form here; handoff
      URIs (handoff=) need a browser flow the plugin doesn't run.
    required_for: full functionality
  - name: SHADOWNET_TOKEN
    prompt: (Optional) Shadownet bearer access token
    help: >-
      Use when you'd rather wire token + endpoint via env. SHADOWNET_CONNECT_URL
      supersedes this when set.
    required_for: alternative split bootstrap
  - name: SHADOWNET_MCP_ENDPOINT
    prompt: (Optional) Shadownet MCP endpoint URL
    help: Direct MCP endpoint when SHADOWNET_TOKEN is set without a connect URI.
    required_for: alternative split bootstrap
  - name: SHADOWNET_LONG_POLL_TIMEOUT_SECONDS
    prompt: Long-poll timeout in seconds (per call)
    default: "30"
    required_for: tuning only
