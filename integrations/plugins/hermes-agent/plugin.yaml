# Hermes Agent plugin manifest for the Shadownet protocol.
#
# Distributed via PyPI (`pip install shadownet-hermes-plugin`) and discovered
# by Hermes through the `hermes_agent.plugins` entry point declared in
# pyproject.toml. The Hermes guide for plugins with third-party Python deps
# explicitly directs distribution via pip — see
# https://hermes-agent.nousresearch.com/docs/user-guide/features/plugins.
# The `hermes plugins install <owner/repo>` path requires plugin.yaml +
# __init__.py at the cloned repo root and does NOT resolve Python deps; our
# plugin pulls in `mcp` and the `shadownet` SDK transitively, so the pip
# entry-point path is the canonical install method.
#
# `requires_env` below is read by Hermes only when a plugin is installed via
# `hermes plugins install` (the Git-clone path). On the pip entry-point path
# Hermes never reads plugin.yaml — env-var validation happens at startup in
# `_adapter.check_shadownet_requirements`. The fields are kept here so the
# manifest is still authoritative if the install path changes.

name: shadownet
version: "0.2.0"
description: >-
  Shadownet protocol integration for Hermes Agent. Adds identity-anchored
  agent-to-agent messaging via the Shadownet protocol (RFC-0007), including
  outbound MCP tools, four skills, and a NAT-free inbound channel via the
  long-poll social_inbox_wait tool.

kind: platform

# Hermes prompts the user for these during `hermes plugins install` and
# verifies they are set at startup. SHADOWNET_TOKEN is the only one without
# a default; the rest can be left blank and the plugin picks sensible values.
requires_env:
  - name: SHADOWNET_TOKEN
    prompt: Shadownet account bearer token
    help: >-
      Mint at <SHADOWNET_SIDECAR_BASE_URL>/connect/hermes-agent on your sidecar's
      account page, or paste a shadownet:// connect URL via SHADOWNET_CONNECT_URL
      instead of this token to bootstrap from one string.
    required_for: full functionality
  - name: SHADOWNET_SIDECAR_BASE_URL
    prompt: Sidecar base URL (https://, or http://localhost for self-hosts)
    default: https://app.sh4dow.org
    required_for: full functionality
  - name: SHADOWNET_CONNECT_URL
    prompt: "(Optional) shadownet:// connect URL — supersedes token + base when set"
    required_for: alternative one-string bootstrap
  - name: SHADOWNET_LONG_POLL_TIMEOUT_SECONDS
    prompt: Long-poll timeout in seconds (per call)
    default: "30"
    required_for: tuning only
