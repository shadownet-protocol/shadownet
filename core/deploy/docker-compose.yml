# Shadownet reference Provider + Issuer servers.
#
# Quickstart:
#   1) On the host: generate signing keys and write the YAML configs.
#        ./bin/shadownet keygen --out ./provider.jwk
#        ./bin/shadownet keygen --out ./issuer.jwk
#        cp deploy/provider-server.yaml provider.yaml
#        cp deploy/issuer-server.yaml issuer.yaml
#        # edit provider.yaml + issuer.yaml as needed
#   2) docker compose up
#   3) Probe:
#        curl http://127.0.0.1:8443/healthz       # provider liveness
#        curl http://127.0.0.1:8444/healthz       # issuer liveness
#
# IMPORTANT: this stack binds plaintext HTTP on the host's loopback
# interface. For any deployment beyond developer-laptop usage, terminate
# TLS in front of the binaries (reverse proxy, k8s ingress) or set the
# tls.cert / tls.key fields in the YAML and bind to 0.0.0.0 in the
# container.

services:
  provider-server:
    image: ghcr.io/shadownet-protocol/provider-server:v0.3.0
    container_name: shadownet-provider
    restart: unless-stopped
    command: ["serve", "--config", "/etc/shadownet/provider.yaml"]
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./provider.yaml:/etc/shadownet/provider.yaml:ro
      - ./provider.jwk:/etc/shadownet/provider.jwk:ro
      - provider-data:/var/lib/shadownet
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8443/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  issuer-server:
    image: ghcr.io/shadownet-protocol/issuer-server:v0.3.0
    container_name: shadownet-issuer
    restart: unless-stopped
    command: ["serve", "--config", "/etc/shadownet/issuer.yaml"]
    ports:
      - "127.0.0.1:8444:8444"
    volumes:
      - ./issuer.yaml:/etc/shadownet/issuer.yaml:ro
      - ./issuer.jwk:/etc/shadownet/issuer.jwk:ro
      - issuer-data:/var/lib/shadownet
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8444/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  provider-data:
  issuer-data:
