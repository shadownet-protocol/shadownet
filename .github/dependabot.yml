version: 2

updates:
  # Go SDK — main module
  - package-ecosystem: gomod
    directory: /core
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - "deps"
      - "area: go-sdk"
    commit-message:
      prefix: "deps(go)"
    groups:
      go-deps:
        applies-to: version-updates
        patterns:
          - "*"
      go-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Go SDK — pgstore submodule (separate go.mod)
  - package-ecosystem: gomod
    directory: /core/pgstore
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - "deps"
      - "area: go-sdk"
      - "area: pgstore"
    commit-message:
      prefix: "deps(go-pgstore)"
    groups:
      go-pgstore-deps:
        applies-to: version-updates
        patterns:
          - "*"
      go-pgstore-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Python SDK
  - package-ecosystem: pip
    directory: /python-sdk
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - "deps"
      - "area: py-sdk"
    commit-message:
      prefix: "deps(py)"
    groups:
      py-deps:
        applies-to: version-updates
        patterns:
          - "*"
      py-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Conformance suite (Python)
  - package-ecosystem: pip
    directory: /conformance
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - "deps"
      - "area: conformance"
    commit-message:
      prefix: "deps(conformance)"
    groups:
      conformance-deps:
        applies-to: version-updates
        patterns:
          - "*"
      conformance-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Conformance: fixture-regen Go emitter (separate go.mod, dev-only — never shipped)
  - package-ecosystem: gomod
    directory: /conformance/fixtures/_regen/go-emit
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - "deps"
      - "area: conformance"
    commit-message:
      prefix: "deps(conformance-go-emit)"
    groups:
      go-emit-deps:
        applies-to: version-updates
        patterns:
          - "*"
      go-emit-security:
        applies-to: security-updates
        patterns:
          - "*"

  # OpenClaw plugin (TypeScript / npm)
  - package-ecosystem: npm
    directory: /integrations/plugins/openclaw
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - "deps"
      - "area: integrations"
    commit-message:
      prefix: "deps(openclaw)"
    groups:
      openclaw-deps:
        applies-to: version-updates
        patterns:
          - "*"
      openclaw-security:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions used by workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - "deps"
      - "area: ci"
    commit-message:
      prefix: "deps(ci)"
    groups:
      ci-actions:
        applies-to: version-updates
        patterns:
          - "*"
      ci-actions-security:
        applies-to: security-updates
        patterns:
          - "*"