name: release (openclaw-plugin)

# Triggered by tags of the shape `openclaw-plugin-vX.Y.Z` (matches the
# convention documented in CLAUDE.md and PUBLISHING.md — hyphen, not slash,
# unlike core/conformance/python-sdk which use slash).
#
# Publishes `@shadownet-protocol/openclaw-plugin` to the public npm registry
# via npm Trusted Publishing (OIDC) — no long-lived NPM_TOKEN required.
# Trust binding is configured per-package at
# https://www.npmjs.com/package/@shadownet-protocol/openclaw-plugin/access,
# matched on (org=shadownet-protocol, repo=shadownet, workflow=release-openclaw-plugin.yml).
#
# ClawHub publishing is a separate manual step (`clawhub package publish .`)
# because ClawHub's auth is browser-OAuth-only; this workflow does the npm
# half only.

on:
  push:
    tags:
      - "openclaw-plugin-v*"

permissions:
  id-token: write    # npm Trusted Publishing — OIDC token exchange
  contents: write    # creating the GitHub Release

concurrency:
  group: release-openclaw-plugin-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: integrations/plugins/openclaw

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          cache-dependency-path: integrations/plugins/openclaw/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        # The webhook.test.ts suite imports `openclaw/plugin-sdk/webhook-ingress`
        # which is not resolvable without OpenClaw installed (peer dep set
        # to auto-install-peers=false in .npmrc). See .github/workflows/integrations.yml
        # for the same exclude on the regular CI lane.
        run: pnpm exec vitest run --exclude 'tests/webhook.test.ts'

      - name: Build
        run: pnpm build

      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          tag_full="${GITHUB_REF#refs/tags/}"
          tag_version="${tag_full#openclaw-plugin-v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::git tag version ($tag_version) does not match package.json version ($pkg_version)"
            exit 1
          fi
          echo "ok: tag and package.json both at $pkg_version"

      - name: Skip publish if version already on npm
        # Makes the workflow re-runnable on a tag that pointed at a commit
        # whose version was already published (e.g. retroactive tag, or
        # CI rerun after a partial failure). The GitHub Release step still
        # runs so the tag has its release page.
        id: check
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          if npm view "$pkg@$ver" version >/dev/null 2>&1; then
            echo "::notice::$pkg@$ver already on npm — skipping publish step"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack tarball (for verification + GitHub Release upload)
        run: pnpm pack

      - name: Publish to npm (Trusted Publishing + provenance)
        if: steps.check.outputs.already_published != 'true'
        # Auth is npm Trusted Publishing: the workflow's OIDC token (gated
        # by `permissions: id-token: write` at the top of the file) is
        # exchanged for a publish credential against the trust binding
        # configured at https://www.npmjs.com/package/<pkg>/access. No
        # NPM_TOKEN secret involved — nothing to rotate or leak.
        #
        # --provenance attaches a signed SLSA Build L3 attestation to the
        # published tarball naming this exact workflow run as the builder.
        # https://docs.npmjs.com/generating-provenance-statements
        #
        # --access public: scoped packages default to private on the npm
        # free tier; explicit public required.
        # --no-git-checks: pnpm guard meaningless in CI (checked out at tag).
        run: pnpm publish --provenance --access public --no-git-checks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: integrations/plugins/openclaw/*.tgz
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc.') || contains(github.ref_name, '-alpha.') || contains(github.ref_name, '-beta.') }}
