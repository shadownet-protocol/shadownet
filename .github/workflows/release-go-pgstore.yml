name: release (Go SDK pgstore)

# Triggered by tags of the shape `sdks/go/pgstore/vX.Y.Z`. The pgstore
# submodule has its own go.mod and ships the `-pg` reference images
# (sca-server-pg, sns-server-pg).

on:
  push:
    tags:
      - "sdks/go/pgstore/v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: parse
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#sdks/go/pgstore/}"
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.+-]+)?$ ]]; then
            echo "::error::tag $tag does not look like sdks/go/pgstore/vX.Y.Z[-pre]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing pgstore $version (from tag $tag)"

  release-note:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      - name: Create release with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release already exists; nothing to do."
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" --generate-notes \
            --title "pgstore ${{ needs.preflight.outputs.version }}"

  images:
    name: ${{ matrix.name }} image
    runs-on: ubuntu-latest
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sca-server-pg
            dockerfile: build/Dockerfile.sca-server-pg
          - name: sns-server-pg
            dockerfile: build/Dockerfile.sns-server-pg
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (OIDC)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ needs.preflight.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.preflight.outputs.version, '-') }}

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          # Dockerfile is in sdks/go/build/ and copies both the parent
          # module's go.mod and pgstore/go.mod; the build context must
          # therefore be the parent module root.
          context: sdks/go
          file: sdks/go/${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ needs.preflight.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
