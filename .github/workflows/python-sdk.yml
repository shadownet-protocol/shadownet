name: Python SDK

on:
  push:
    branches: [main]
    paths:
      - "python-sdk/**"
      - "examples/birthday-credential-py/**"
      - ".github/workflows/python-sdk.yml"
  pull_request:
    paths:
      - "python-sdk/**"
      - "examples/birthday-credential-py/**"
      - ".github/workflows/python-sdk.yml"

permissions:
  contents: read

concurrency:
  group: py-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: python-sdk

jobs:
  test:
    name: test (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "python-sdk/uv.lock"

      - name: Sync dependencies
        run: uv sync --all-extras --python ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check (mypy --strict)
        run: uv run mypy src/shadownet

      - name: Test (with coverage)
        run: uv run pytest --cov-report=xml --cov-report=term

      - name: examples — run birthday-credential-py
        # Catches API drift between the SDK and the example without needing
        # a separate workflow. The example only uses public APIs, so a
        # successful run is a smoke-test of the SDK's exported surface.
        run: uv run python ../examples/birthday-credential-py/birthday_credential.py

      - name: Upload coverage to Codecov
        if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: python-sdk/coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  build:
    name: build (sdist + wheel)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "python-sdk/uv.lock"

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Build distribution
        run: uv build

      - name: Verify py.typed marker is shipped
        run: |
          unzip -l dist/shadownet-*.whl | grep -q 'shadownet/python-sdk\.typed' \
            || { echo "py.typed missing from wheel"; exit 1; }

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python-sdk/dist/*
          if-no-files-found: error
          retention-days: 7
