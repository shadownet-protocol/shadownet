name: release (core)

# Triggered by tags of the shape `core/vX.Y.Z`. This builds the two
# reference server binaries (provider-server + issuer-server) and pushes
# multi-arch GHCR images. The pgstore submodule has its own release
# workflow and tag pattern.

on:
  push:
    tags:
      - "core/v*"

permissions:
  contents: write   # create GitHub Release + upload assets
  packages: write   # push images to ghcr.io
  id-token: write   # OIDC for sigstore / provenance

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Parse tag
        id: parse
        # Strip the `core/` prefix; pgstore tags are routed to a separate
        # workflow so we reject them defensively.
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" == core/pgstore/* ]]; then
            echo "::error::pgstore tags ($tag) belong to release-core-pgstore.yml"
            exit 1
          fi
          version="${tag#core/}"
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.+-]+)?$ ]]; then
            echo "::error::tag $tag does not look like core/vX.Y.Z[-pre]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (from tag $tag)"

  binaries:
    name: server binary tarballs
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          check-latest: true
          cache-dependency-path: core/go.sum

      - name: Cross-compile binaries
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        working-directory: core
        run: |
          set -euo pipefail
          # ../ from core/ is the repo root. The upload step below runs at
          # the repo root and references `dist/*` relative to there.
          mkdir -p ../dist
          for tuple in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${tuple%/*}"
            goarch="${tuple#*/}"
            outdir="shadownet_${VERSION}_${goos}_${goarch}"
            mkdir -p "$outdir"
            for bin in provider-server issuer-server; do
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
                go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
                  -o "$outdir/$bin" "./cmd/$bin"
            done
            cp LICENSE README.md "$outdir/"
            tar -czf "../dist/shadownet_${VERSION}_${goos}_${goarch}.tar.gz" "$outdir"
            rm -rf "$outdir"
          done
          ( cd ../dist && sha256sum ./*.tar.gz > SHA256SUMS )
          ls -la ../dist

      - name: Create GitHub Release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_flag="--generate-notes"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            notes_flag=""
          else
            gh release create "${GITHUB_REF_NAME}" $notes_flag \
              --title "core ${{ needs.preflight.outputs.version }}"
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS --clobber

  images:
    name: ${{ matrix.name }} image
    runs-on: ubuntu-latest
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: provider-server
            dockerfile: core/build/Dockerfile.provider-server
          - name: issuer-server
            dockerfile: core/build/Dockerfile.issuer-server
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR (OIDC)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          # :latest only on the highest semver, never pre-release.
          tags: |
            type=raw,value=${{ needs.preflight.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.preflight.outputs.version, '-') }}

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          # Build context is the repo root; the Dockerfile lives under
          # core/build/ and COPYs from core/.
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ needs.preflight.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
