name: Conformance

# Wire-level conformance for Shadownet v0.2. Runs the in-tree conformance
# suite (conformance/) against a pinned ref of shadownet-specs. The suite's
# schema-level tests exercise every v0.2 wire artifact (credential, csr,
# envelope, agentcard for both addressing modes) plus URI grammar and
# receiver-pipeline invariants. No live binaries are required at this stage;
# the v0.2 cross-impl wire job (boot core/'s provider-server + issuer-server
# and run live tests against them) returns when the conformance suite ships
# provider/issuer-specific test files in a follow-up release.

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "python-sdk/**"
      - "conformance/**"
      - ".github/workflows/conformance.yml"
  pull_request:
    paths:
      - "core/**"
      - "python-sdk/**"
      - "conformance/**"
      - ".github/workflows/conformance.yml"

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

# Pin shadownet-specs at a known ref. Bump alongside spec releases; CI is
# the source of truth for which spec we claim to implement.
env:
  SPECS_REF: feat/shadow1

jobs:
  schemas:
    name: Schema + wire-shape conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout shadownet-specs
        uses: actions/checkout@v7
        with:
          repository: shadownet-protocol/shadownet-specs
          ref: ${{ env.SPECS_REF }}
          path: shadownet-specs

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "conformance/uv.lock"

      - name: Sync conformance suite
        working-directory: conformance
        run: uv sync --all-extras

      - name: Verify fixtures are byte-stable
        working-directory: conformance
        run: uv run shadownet-conformance-fixtures regen --check

      - name: Run conformance suite (schema + wire-shape tests)
        working-directory: conformance
        env:
          SHADOWNET_CONFORMANCE_SPECS_PATH: ${{ github.workspace }}/shadownet-specs
        run: |
          uv run shadownet-conformance \
            --specs-path "$SHADOWNET_CONFORMANCE_SPECS_PATH" \
            --report-junit=conformance.xml \
            --report-json=conformance.json \
            --gha-summary=auto

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-reports
          path: |
            conformance/conformance.xml
            conformance/conformance.json
          if-no-files-found: warn
          retention-days: 7
