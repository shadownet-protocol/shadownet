blank_issues_enabled: false
contact_links:
  - name: Protocol question or RFC proposal
    url: https://github.com/shadownet-protocol/shadownet-specs/issues/new/choose
    about: For questions about the spec, RFC drafts, or wire-level changes, please file in shadownet-specs.
  - name: Security vulnerability
    url: https://github.com/shadownet-protocol/shadownet/security/advisories/new
    about: Report security issues privately via GitHub Security Advisories. Do not file public issues for vulnerabilities.
  - name: Conformance suite issue
    url: https://github.com/shadownet-protocol/shadownet-conformance/issues/new
    about: For bugs in the cross-implementation conformance suite or its fixtures.
