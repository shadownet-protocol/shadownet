# Versioned seed manifest for shadownet-conformance fixtures.
#
# Each seed is 32 bytes (Ed25519 seed length per RFC 8032 §5.1.5). Seeds are
# committed and clearly non-secret — they exist to make fixtures reproducible.
# Changing a seed is a deliberate, reviewed event: it forces a regeneration
# of every fixture derived from it and updates every committed byte. See
# fixtures/README.md for the regen procedure.
#
# Seed naming reflects the role each keypair plays in v0.2 wire flows, not
# arbitrary labels — cross-references in tests stay readable.

schema_version = 2

[seeds.subject_alice]
# Holder of the canonical org_affiliation credential used in most fixtures.
# Shadowname `alice@sh4dow.org` in Shadowname-mode fixtures; bare key
# wherever the credential exercises direct addressing.
hex = "0101010101010101010101010101010101010101010101010101010101010101"

[seeds.subject_bob]
# A second Shadow used in negative-path and round-trip tests
# (`bob@example.org` in Shadowname mode).
hex = "0202020202020202020202020202020202020202020202020202020202020202"

[seeds.subject_acme]
# Domain-key for `acme.example` — the canonical keyed org / Hub.
hex = "0303030303030303030303030303030303030303030303030303030303030303"

[seeds.hub_issuer]
# Canonical org-affiliation issuer signing key.
# Used both as a keyed Hub (iss == public key) and via a delegate domain
# (`tiergarten-club.example`) depending on the test.
hex = "1010101010101010101010101010101010101010101010101010101010101010"

[seeds.provider]
# Canonical Shadowname-mode Provider signing key — signs AgentCards served
# at `<ep>/identity/<local>` per RFC 0001 §5.2. Default provider domain is
# `sh4dow.org`; tests that need a second provider use a derived label.
hex = "2020202020202020202020202020202020202020202020202020202020202020"

[seeds.peer_shadow]
# The in-process A2A test peer's identity. Sidecar tests handshake against
# this peer. In Shadowname-mode tests the peer is bound to a provider; in
# direct-mode tests the peer's bare public key IS the wire identifier.
hex = "3030303030303030303030303030303030303030303030303030303030303030"