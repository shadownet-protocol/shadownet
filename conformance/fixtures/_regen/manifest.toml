# Declarative fixture manifest — Shadownet v0.2.
#
# Each entry describes exactly one fixture file. The regen CLI:
#   1. Resolves seeds from ../seeds.toml.
#   2. Emits the resolved spec via the Python emitter
#      (`python -m shadownet_conformance.regen.py_emit <kind>`).
#   3. Writes the result to `fixtures/<out>`.
#
# The Go round-trip emitter (v0.1's interop safety net) is removed at v0.2
# until both `core/` (Go SDK + reference Provider/Issuer) and `python-sdk`
# reach feature parity. The Python emitter is the single source of truth
# until then. Cross-impl byte-equality checks will be reinstated as a v0.2.x
# follow-up using core/'s Provider+Issuer binaries as the Go-side oracle.
#
# Order matters where one fixture references another (envelopes reference
# credentials, etc.). The CLI emits in declaration order.

schema_version = 2

# Keys (one per seed). Output: {public_key, private_jwk} JSON.

[[fixtures]]
id   = "key_subject_alice"
kind = "key"
out  = "keys/subject_alice.json"
[fixtures.spec]
seed = "subject_alice"

[[fixtures]]
id   = "key_subject_bob"
kind = "key"
out  = "keys/subject_bob.json"
[fixtures.spec]
seed = "subject_bob"

[[fixtures]]
id   = "key_subject_acme"
kind = "key"
out  = "keys/subject_acme.json"
[fixtures.spec]
seed = "subject_acme"

[[fixtures]]
id   = "key_hub_issuer"
kind = "key"
out  = "keys/hub_issuer.json"
[fixtures.spec]
seed = "hub_issuer"

[[fixtures]]
id   = "key_provider"
kind = "key"
out  = "keys/provider.json"
[fixtures.spec]
seed = "provider"

[[fixtures]]
id   = "key_peer_shadow"
kind = "key"
out  = "keys/peer_shadow.json"
[fixtures.spec]
seed = "peer_shadow"

# Status bitstrings (issued first so credential `rev.idx` references match).

[[fixtures]]
id   = "status_bitstring_hub_2026q2"
kind = "status_bitstring"
out  = "status_bitstrings/hub_2026q2.txt"
[fixtures.spec]
# 8192-bit (1 KiB) bitstring with bit 871 set — matches alice's
# rev.idx in credentials below for revocation-positive fixtures.
size_bits     = 8192
revoked_idx   = [871]

# Credentials — v0.2 `shadownet-cred+jwt` with kind=org_affiliation.

[[fixtures]]
id   = "credential_alice_hub"
kind = "credential"
out  = "credentials/alice_hub.jwt"
[fixtures.spec]
issuer_seed   = "hub_issuer"
issuer        = "tiergarten-club.example"  # delegate-mode domain issuer
sub           = "alice@sh4dow.org"
org           = "tiergarten-club.example"
iat           = 1756684800        # 2025-09-01T00:00:00Z
exp           = 1759276800        # 2025-10-01T00:00:00Z
epoch         = "2026q2"
idx           = 42                # NOT in the status bitstring; this cred is live

[[fixtures]]
id   = "credential_alice_keyed_hub"
kind = "credential"
out  = "credentials/alice_keyed_hub.jwt"
[fixtures.spec]
# Keyed-issuer variant: iss == org == hub's pubkey. RFC 0001 §6.6 rule 1
# is the only authorization path open to keyed issuers / Hubs.
issuer_seed   = "hub_issuer"
issuer        = "$pk:hub_issuer"  # emitter substitutes the encoded pubkey
sub           = "alice@sh4dow.org"
org           = "$pk:hub_issuer"
iat           = 1756684800
exp           = 1759276800
epoch         = "2026q2"
idx           = 100

[[fixtures]]
id   = "credential_alice_revoked"
kind = "credential"
out  = "credentials/alice_revoked.jwt"
[fixtures.spec]
# Same alice but with rev.idx = 871, which IS set in the hub_2026q2
# bitstring above — verifiers MUST reject this on status-list check.
issuer_seed   = "hub_issuer"
issuer        = "tiergarten-club.example"
sub           = "alice@sh4dow.org"
org           = "tiergarten-club.example"
iat           = 1756684800
exp           = 1759276800
epoch         = "2026q2"
idx           = 871

[[fixtures]]
id   = "credential_bob_hub"
kind = "credential"
out  = "credentials/bob_hub.jwt"
[fixtures.spec]
issuer_seed   = "hub_issuer"
issuer        = "tiergarten-club.example"
sub           = "bob@example.org"
org           = "tiergarten-club.example"
iat           = 1756684800
exp           = 1759276800
epoch         = "2026q2"
idx           = 43

[[fixtures]]
id   = "credential_peer_hub"
kind = "credential"
out  = "credentials/peer_hub.jwt"
[fixtures.spec]
issuer_seed   = "hub_issuer"
issuer        = "tiergarten-club.example"
sub           = "peer@sh4dow.org"
org           = "tiergarten-club.example"
iat           = 1756684800
exp           = 1759276800
epoch         = "2026q2"
idx           = 44

# CSRs — v0.2 `shadownet-csr+jwt`. Idempotent within a ceremony per §6.5.

[[fixtures]]
id   = "csr_alice_to_hub"
kind = "csr"
out  = "csr/alice_to_hub.jose"
[fixtures.spec]
subject_seed  = "subject_alice"
iss           = "alice@sh4dow.org"
aud           = "tiergarten-club.example"
iat           = 1756684800
exp           = 1756685100        # +5 min, within §6.5's 600s recommended cap
req_kind      = "org_affiliation"
req_org       = "tiergarten-club.example"

# AgentCards — Shadowname-mode (provider-signed) + direct-mode (self-signed).

[[fixtures]]
id   = "agentcard_alice_shadowname"
kind = "agentcard"
out  = "agentcards/alice_shadowname.json"
[fixtures.spec]
mode             = "shadowname"
provider_seed    = "provider"
provider_domain  = "sh4dow.org"
subject_seed     = "subject_alice"
local            = "alice"
shadowname       = "alice@sh4dow.org"
a2a_url          = "https://shadow.sh4dow.org/v1/a2a/alice"
name             = "Alice"
description      = "Alice's Shadow"
version          = "1.0.0"

[[fixtures]]
id   = "agentcard_bob_direct"
kind = "agentcard"
out  = "agentcards/bob_direct.json"
[fixtures.spec]
mode          = "direct"
subject_seed  = "subject_bob"
a2a_url       = "https://bob-vps.example.com:8443/a2a"
name          = "Bob"
description   = "Bob's Shadow (direct mode)"
version       = "1.0.0"

# Envelopes — `shadownet-env+jwt` carrying a credential, bound to the
# surrounding A2A message via msgHash.

[[fixtures]]
id   = "envelope_alice_to_bob"
kind = "envelope"
out  = "envelopes/alice_to_bob.jws"
[fixtures.spec]
sender_seed    = "subject_alice"
from_id        = "alice@sh4dow.org"
to_id          = "bob@example.org"
iat            = 1756684900
exp            = 1756685100       # +200s, within §8.3's 300s bound
body_text      = "Hi Bob — want to grab dinner Thursday?"
message_id     = "01HZ7K3CWAB4D6N5XT0M2EXAMPLE"
context_id     = "01HZ7K2BV5R2K0DW3FCONTEXT0001"
creds          = ["credentials/alice_hub.jwt"]

[[fixtures]]
id   = "envelope_alice_to_bob_direct"
kind = "envelope"
out  = "envelopes/alice_to_bob_direct.jws"
[fixtures.spec]
# Cross-mode: Shadowname sender, direct-mode recipient (bare pk).
sender_seed    = "subject_alice"
from_id        = "alice@sh4dow.org"
to_id          = "$pk:subject_bob"
iat            = 1756684900
exp            = 1756685100
body_text      = "Hi Bob — want to grab dinner Thursday?"
message_id     = "01HZ7K3CWAB4D6N5XT0M2EXAMPLE"
context_id     = "01HZ7K2BV5R2K0DW3FCONTEXT0001"
creds          = ["credentials/alice_hub.jwt"]